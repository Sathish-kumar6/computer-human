<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="guessStyle.css">
</head>
<body>
    <h3 id="note">Note : Guess the number generated by the computer. If your number matches, You win a point. </h3>
    
    <div id="fullDataForm">
        <h1 id="title">COMPUTER <span style="color: orange; font-weight: bolder; font-size: xx-large;">Vs</span> HUMAN</h1>
        <input type="text" placeholder="Enter any number 0-10" id="enternumber">
        <br><br>
        <button onclick="change()">Submit Guess</button>
        <h2 id="answer">your Guessing <span id="correct">Correct</span>/<span id="wrong">Wrong</span></h2>
        <h3 id="score">Score : ?/10</h3>
    </div>
    
    <div id="realguess">
        <h2 id="human">HUMAN : 0</h2>
        <h2 id="computer">COMPUTER : 0</h2>
    </div>
    <script src="randomNum.js"></script>
</body>
</html>
