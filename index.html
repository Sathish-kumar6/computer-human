<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="guessStyle.css">
</head>
<body>
    <h3 id="note">Note : Guess the number generated by the computer. If your number matches, You win a point. </h3>
    
    <div id="fullDataForm">
        <h1 id="title">COMPUTER <span style="color: orange; font-weight: bolder; font-size: xx-large;">Vs</span> HUMAN</h1>
        <input type="text" placeholder="Enter any number 0-10" id="enternumber">
        <br><br>
        <button onclick="change()">Submit Guess</button>
        <h2 id="answer">your Guessing <span id="correct">Correct</span>/<span id="wrong">Wrong</span></h2>
        <h3 id="score">Score : ?/10</h3>
    </div>
    
    <div id="realguess">
        <h2 id="human">HUMAN : 0</h2>
        <h2 id="computer">COMPUTER : 0</h2>
    </div>
</body>

<script>
    var enterednumber = document.getElementById("enternumber")
    var answer = document.getElementById("answer")
    var outputscore = document.getElementById("score")

    var randomnumber = Math.floor(Math.random()*10)+1

    var scoree = 0
    
    function change(){
        enterednumberinput = enterednumber.value
        if(enterednumberinput==randomnumber)
        {
            answer.textContent = "Correct Guess"
            answer.style.color = "green"
            score.textContent = "Your score :"+ scoree+1
       
        }
        else if(enterednumberinput=="")
        {
            alert("Please enter your number")
        }
       
        else
        {
            scoree = scoree-1
            score.textContent = "Your score :"+ scoree
            answer.textContent = "Wrong! Guess"
            answer.style.color = "red"

            if(scoree<=0)
            {
                alert("Your Session Completed.")
                location.reload()
                document.getElementById("fullDataForm").style.backgroundColor="red"
                document.getElementById("fullDataForm").textContent="you failed you guessing"
            }
         }
         document.getElementById("human").textContent="HUMAN :"+enterednumberinput
         document.getElementById("computer").textContent="COMPUTER :"+randomnumber

         randomnumber = Math.floor(Math.random()*10)+1
         
    }
</script>
</html>
